<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2c">
  <title>BIOB90 · Find Your Project Direction</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="BIOB90 home">
      <span class="brand-mark">B90</span>
      <span><strong>BIOB90</strong><small>Streams, topics &amp; teams</small></span>
    </a>
    <div id="save-status" class="save-status" aria-live="polite"></div>
  </header>

  <main class="shell">
    <div id="progress" class="progress-wrap" hidden></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="app" aria-live="polite"></div>
  </main>

  <footer>
    <span>BIOB90 · University of Toronto Scarborough</span>
    <button id="instructor-open" class="text-button" type="button">Course instructor</button>
  </footer>

  <dialog id="instructor-dialog">
    <button class="dialog-close" type="button" aria-label="Close">×</button>
    <div id="instructor-content"></div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
